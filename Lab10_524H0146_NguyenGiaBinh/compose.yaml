services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD}
    volumes:
      - school:/var/opt/mssql
      - ./School.sql:/tmp/School.sql:ro
  mvc:
    build: ./Mvc
    ports: ["8081:8080"]
    environment:
      ConnectionStrings__School: "Server=db;Database=SchoolLab08;User ID=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
  razor:
    build: ./Razor
    ports: ["8082:8080"]
    environment:
      ConnectionStrings__School: "Server=db;Database=SchoolLab08;User ID=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
volumes:
  school: {}
