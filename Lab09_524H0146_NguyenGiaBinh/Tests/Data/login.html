<!doctype html><html lang="en"><meta charset="utf-8"><title>Lab 9 · Browser test fixture</title><main><h1>Student login</h1><form id="loginForm"><label>Username <input id="username"></label><label>Password <input id="password" type="password"></label><button id="loginButton">Login</button></form><p id="result" aria-live="polite"></p></main><script>
document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#result').textContent=document.querySelector('#username').value==='user1'&&document.querySelector('#password').value==='password1'?'Welcome':'Invalid credentials';};
</script></html>
